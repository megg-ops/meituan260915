<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAFBF9">
<title>周末出发 WeekendGO · 大学生的周末探索计划</title>
<link rel="preload" as="image" href="assets/map-hangzhou-sunny-v1.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body data-weather="sunny">

<!-- 共享 SVG：印章粗糙滤镜与线性图标 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
    <symbol id="i-weekend" viewBox="0 0 24 24"><path d="M2.5 19.5 9 8.5l3.2 5.3L15 10l6.5 9.5z" fill="currentColor"/></symbol>
    <symbol id="i-weekend-o" viewBox="0 0 24 24"><path d="M2.5 19.5 9 8.5l3.2 5.3L15 10l6.5 9.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-team" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.4"/><path d="M3 19.5c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="16.5" cy="7.5" r="2.6"/><path d="M16 12.8c2.6 0 4.4 1.4 5 4.2"/></g></symbol>
    <symbol id="i-collect" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 6.5C9.8 5 6.8 4.6 3.5 5v13c3.3-.4 6.3 0 8.5 1.5 2.2-1.5 5.2-1.9 8.5-1.5V5c-3.3-.4-6.3 0-8.5 1.5z"/><path d="M12 6.5v13"/></g></symbol>
    <symbol id="i-me" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.8 3.8-5.8 7.5-5.8s6.7 2 7.5 5.8"/></g></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9h12l-6 7z" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 30"><path d="M12 29s10-11 10-18A10 10 0 0 0 2 11c0 7 10 18 10 18z" fill="currentColor"/><circle cx="12" cy="11" r="4" fill="#fff"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sunny" viewBox="0 0 48 48"><g stroke="#E4B04F" stroke-width="2.6" stroke-linecap="round"><path d="M24 3v6M24 39v6M3 24h6M39 24h6M9.2 9.2l4.2 4.2M34.6 34.6l4.2 4.2M9.2 38.8l4.2-4.2M34.6 13.4l4.2-4.2"/></g><circle cx="24" cy="24" r="10" fill="#EDC777"/><circle cx="21" cy="21" r="4" fill="#F6DD9B"/></symbol>
    <symbol id="i-cloudy" viewBox="0 0 48 48"><circle cx="17" cy="17" r="7" fill="#EDC777"/><path d="M14 36h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z" fill="#C9DBDA" stroke="#8FB0AE" stroke-width="2"/></symbol>
    <symbol id="i-rain" viewBox="0 0 48 48"><path d="M13 29h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z" fill="#BCD3DE" stroke="#6D98B2" stroke-width="2"/><g stroke="#4F87AB" stroke-width="2.6" stroke-linecap="round"><path d="M17 34l-2 5M25 34l-2 5M33 34l-2 5"/></g></symbol>
    <symbol id="i-snow" viewBox="0 0 48 48"><path d="M13 28h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z" fill="#E6EEF2" stroke="#8EA6B6" stroke-width="2"/><g fill="#8EA6B6"><circle cx="16" cy="35" r="2"/><circle cx="24" cy="39" r="2"/><circle cx="32" cy="35" r="2"/></g></symbol>
    <symbol id="i-unknown" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" fill="none" stroke="#9AA9A6" stroke-width="2.4" stroke-dasharray="4 4"/><path d="M19.5 20a4.5 4.5 0 1 1 6.3 4.1c-1.2.6-1.8 1.4-1.8 2.9M24 32.5v.5" fill="none" stroke="#7C8C89" stroke-width="2.4" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="app">
  <main>
    <!-- ============ 周末 ============ -->
    <section class="page on" id="page-weekend" aria-label="周末">
      <header class="top">
        <div class="brand">
          <b class="brand-name">周末出发<svg class="brush" viewBox="0 0 90 10" aria-hidden="true"><path d="M3 7c20-4 44-5 84-3" fill="none" stroke="#D87843" stroke-width="3" stroke-linecap="round"/></svg></b>
          <span class="brand-sub">大学生的周末探索计划</span>
        </div>
        <button class="city" id="cityBtn" aria-label="切换城市"><span id="cityLabel">杭州</span><svg><use href="#i-down"/></svg></button>
      </header>

      <div class="hero">
        <div class="hero-text">
          <h1 id="heroTitle"></h1>
          <p class="count" id="countdown"></p>
        </div>
        <button class="wx" id="wxBtn" aria-label="当前天气，点击切换天气演示">
          <svg class="wx-ico" id="wxIcon"><use href="#i-sunny"/></svg>
          <span class="wx-now" id="wxNow"></span>
          <span class="wx-temp" id="wxTemp"></span>
          <span class="wx-demo">天气演示<svg><use href="#i-chev"/></svg></span>
        </button>
      </div>

      <div class="scene" id="scene"></div>
      <div class="spot" id="spot"></div>

      <section class="block" id="planBlock" hidden></section>

      <section class="block">
        <div class="block-head">
          <h2>这周末，为你挑了 3 个</h2>
          <button class="link" id="prefBtn">调整偏好</button>
        </div>
        <p class="block-note" id="recNote"></p>
        <div class="rec-list" id="recList"></div>
        <button class="link more" id="moreBtn" hidden></button>
      </section>
      <p class="foot-note">活动、天气与队伍为演示数据 · 打卡与票根只保存在本机</p>
    </section>

    <!-- ============ 组队 ============ -->
    <section class="page" id="page-team" aria-label="组队">
      <header class="page-head">
        <h1>组队</h1>
        <p id="teamSub"></p>
      </header>
      <div id="teamList"></div>
      <p class="foot-note">队伍与成员为演示数据，加入和退出只保存在本机</p>
    </section>

    <!-- ============ 收集 ============ -->
    <section class="page" id="page-collect" aria-label="我的收集">
      <header class="page-head">
        <h1>我的收集</h1>
        <p id="collectSub"></p>
      </header>
      <div id="collectBody"></div>
    </section>

    <!-- ============ 我的 ============ -->
    <section class="page" id="page-me" aria-label="我的">
      <header class="page-head"><h1>我的</h1></header>
      <div id="meBody"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="主导航">
    <button data-tab="weekend" class="on"><svg class="ico-on"><use href="#i-weekend"/></svg><svg class="ico-off"><use href="#i-weekend-o"/></svg><span>周末</span></button>
    <button data-tab="team"><svg><use href="#i-team"/></svg><span>组队</span></button>
    <button data-tab="collect"><svg><use href="#i-collect"/></svg><span>收集</span></button>
    <button data-tab="me"><svg><use href="#i-me"/></svg><span>我的</span></button>
  </nav>
</div>

<div class="mask" id="mask" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="reveal" id="reveal" role="dialog" aria-modal="true" aria-label="打卡成功" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
