<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>周末出发 WeekendGO · 周末城市探索指南</title>
<style>
:root{
  --primary:#FF7A00; --primary2:#FFB800; --grad:linear-gradient(135deg,#FF7A00,#FFB800);
  --ink:#1F2329; --sub:#6B7280; --line:#ECEEF1; --bg:#F6F7F9; --card:#fff;
  --green:#10B981; --blue:#3B82F6; --purple:#8B5CF6; --red:#F43F5E;
  --r:16px; --shadow:0 4px 20px rgba(31,35,41,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:#E9EBEE;color:var(--ink);font-size:15px;line-height:1.5}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column}
/* ---------- header ---------- */
header{background:var(--grad);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:50;border-radius:0 0 20px 20px}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.5px}
.logo .go{background:rgba(255,255,255,.22);border-radius:8px;padding:0 6px;font-size:13px;font-weight:700}
.city-btn{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:13px;padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:4px;cursor:pointer}
.weather-bar{margin-top:10px;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px}
.w-main{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px}
.w-sim{display:flex;gap:4px}
.w-sim button{border:none;background:rgba(255,255,255,.2);color:#fff;font-size:11px;padding:3px 8px;border-radius:12px;cursor:pointer;transition:.2s}
.w-sim button.on{background:#fff;color:var(--primary);font-weight:700}
.w-sim button:hover{background:rgba(255,255,255,.35)}
/* ---------- preference panel ---------- */
.pref{margin:12px 12px 0;background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.pref-title{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-size:12.5px;cursor:pointer;transition:.15s;color:var(--sub)}
.chip.on{background:#FFF3E0;border-color:var(--primary);color:var(--primary);font-weight:600}
.budget-row{display:flex;align-items:center;gap:10px;margin-top:4px}
input[type=range]{flex:1;accent-color:var(--primary)}
.budget-val{font-size:13px;font-weight:700;color:var(--primary);min-width:64px;text-align:right}
.row2{display:flex;gap:12px}
.row2>div{flex:1}
/* ---------- main / tabs ---------- */
main{flex:1;padding-bottom:76px}
.page{display:none;padding:12px;animation:fadein .25s}
.page.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.sec-head h2{font-size:16.5px;font-weight:800}
.sec-head .more{font-size:12px;color:var(--sub);cursor:pointer}
/* ---------- activity cards ---------- */
.act-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;cursor:pointer;transition:transform .15s}
.act-card:active{transform:scale(.985)}
.act-top{display:flex;gap:12px;padding:12px 12px 8px}
.cover{width:76px;height:76px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0}
.act-info{flex:1;min-width:0}
.cat-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;margin-bottom:3px;color:#fff}
.act-title{font-size:15.5px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-meta{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:1px}
.match-pill{position:absolute;right:12px;top:12px}
.act-card{position:relative}
.match-pill{background:#FFF3E0;color:var(--primary);font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px}
.reasons{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 10px}
.reason{font-size:11px;padding:2px 8px;border-radius:8px;background:#F3F4F6;color:var(--sub)}
.reason.good{background:#ECFDF5;color:var(--green)}
.reason.warn{background:#FEF2F2;color:var(--red)}
.act-foot{display:flex;border-top:1px solid var(--line)}
.act-foot button{flex:1;border:none;background:none;padding:9px 0;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.act-foot button:hover{background:#FAFAFB}
.act-foot button.primary{color:var(--primary)}
.act-foot button+button{border-left:1px solid var(--line)}
.empty{text-align:center;color:var(--sub);padding:40px 0;font-size:13.5px}
.empty .big{font-size:40px;display:block;margin-bottom:8px}
/* ---------- team cards ---------- */
.team-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.team-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.team-title{font-weight:700;font-size:15px}
.team-sub{font-size:12px;color:var(--sub);margin-top:2px}
.slots{font-size:12px;font-weight:700;color:var(--blue);background:#EFF6FF;padding:2px 9px;border-radius:10px;flex-shrink:0}
.slots.full{color:var(--sub);background:#F3F4F6}
.team-info{font-size:12.5px;color:var(--sub);display:flex;flex-direction:column;gap:3px;margin:8px 0 10px}
.avatars{display:flex;align-items:center;margin-top:8px}
.avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;border:2px solid #fff;margin-left:-6px}
.avatar:first-child{margin-left:0}
.avatar.ghost{background:#F3F4F6;color:#C4C9D0;border-style:dashed}
.join-btn{background:var(--grad);color:#fff;border:none;border-radius:20px;padding:7px 18px;font-size:13px;font-weight:700;cursor:pointer;float:right}
.join-btn:disabled{background:#E5E7EB;color:#9CA3AF;cursor:not-allowed}
.join-btn.joined{background:#ECFDF5;color:var(--green)}
.fab{position:fixed;bottom:86px;right:calc(50% - 215px + 14px);width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;border:none;font-size:26px;box-shadow:0 6px 18px rgba(255,122,0,.4);cursor:pointer;z-index:40;display:flex;align-items:center;justify-content:center}
@media(max-width:430px){.fab{right:14px}}
/* ---------- checkin ---------- */
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 8px;text-align:center}
.stat .num{font-size:20px;font-weight:800;color:var(--primary)}
.stat .lbl{font-size:11px;color:var(--sub);margin-top:2px}
.tl-item{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px}
.tl-emoji{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.tl-body{flex:1;min-width:0}
.tl-title{font-weight:700;font-size:14px}
.tl-note{font-size:13px;color:var(--ink);margin:3px 0}
.tl-time{font-size:11px;color:var(--sub)}
.mood{font-size:16px;margin-right:4px}
/* ---------- guides ---------- */
.guide-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;cursor:pointer}
.g-title{font-weight:700;font-size:15px;margin-bottom:4px}
.g-excerpt{font-size:12.5px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:var(--sub)}
.g-like{border:none;background:#FFF1F2;color:var(--red);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:12px;cursor:pointer}
.g-tags{display:flex;gap:5px;margin-top:6px}
.g-tag{font-size:10.5px;background:#F3F4F6;color:var(--sub);padding:1px 8px;border-radius:8px}
/* ---------- tabbar ---------- */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;padding:8px 0 10px;font-size:10.5px;color:#9CA3AF;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ico{font-size:20px}
nav button.on{color:var(--primary);font-weight:700}
/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:430px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:18px 16px 28px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h3{font-size:17px;font-weight:800}
.close{border:none;background:#F3F4F6;width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--sub)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:5px}
.field input[type=text],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none}
.field textarea{resize:none;height:76px}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.big-btn{width:100%;background:var(--grad);color:#fff;border:none;border-radius:24px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.tag-grid{display:flex;flex-wrap:wrap;gap:7px}
.detail-hero{border-radius:14px;padding:22px;text-align:center;font-size:48px;margin-bottom:12px}
.d-row{display:flex;gap:10px;margin-bottom:10px;font-size:13.5px}
.d-row .k{color:var(--sub);min-width:58px;flex-shrink:0}
.d-desc{font-size:13.5px;color:#374151;background:#F9FAFB;border-radius:12px;padding:12px;margin:10px 0}
.d-actions{display:flex;gap:10px;margin-top:14px}
.d-actions button{flex:1;border-radius:22px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid var(--primary)}
.btn-ghost{background:#fff;color:var(--primary)}
.btn-solid{background:var(--grad);color:#fff;border:none!important}
/* ---------- product intro ---------- */
.pi-sec{margin-bottom:14px}
.pi-sec h4{font-size:13.5px;font-weight:800;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.pi-sec p,.pi-sec li{font-size:12.8px;color:#4B5563}
.pi-sec ul{padding-left:18px}
.pi-box{background:#FFF8F0;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pi-box b{font-size:12.8px}
.tree{font-family:ui-monospace,Consolas,monospace;font-size:11.8px;background:#1F2329;color:#E5E7EB;border-radius:12px;padding:12px;line-height:1.7;white-space:pre;overflow-x:auto}
/* ---------- toast ---------- */
#toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);background:rgba(31,35,41,.88);color:#fff;padding:9px 20px;border-radius:22px;font-size:13.5px;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:80%;text-align:center}
#toast.on{opacity:1}
.footer-note{text-align:center;font-size:11px;color:#B0B6BE;padding:8px 0 4px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="h-row">
      <div class="logo">🧭 周末出发<span class="go">WeekendGO</span></div>
      <div style="display:flex;gap:6px">
        <button class="city-btn" onclick="openAbout()" style="font-weight:700">ℹ️ 说明</button>
        <button class="city-btn" onclick="openCityPicker()">📍 <span id="cityLabel">北京</span> ▾</button>
      </div>
    </div>
    <div class="weather-bar">
      <div class="w-main" id="weatherMain">☀️ 晴 26°C</div>
      <div class="w-sim" title="模拟天气变化，观察推荐实时调整">
        <span style="opacity:.85">模拟天气</span>
        <button data-w="sunny" class="on">晴</button><button data-w="cloudy">多云</button><button data-w="rain">雨</button>
      </div>
    </div>
  </header>

  <main>
    <!-- ============ Tab 1 逛逛 ============ -->
    <section class="page on" id="page-discover">
      <div class="pref">
        <div class="pref-title"><span>🎯 我的周末偏好</span><span id="prefSummary" style="font-weight:400"></span></div>
        <div style="font-size:11.5px;color:var(--sub);margin-bottom:5px">感兴趣的类型（可多选）</div>
        <div class="chips" id="interestChips"></div>
        <div class="row2" style="margin-top:10px">
          <div>
            <div style="font-size:11.5px;color:var(--sub);margin-bottom:5px">💰 本周末预算上限</div>
            <div class="budget-row"><input type="range" id="budgetRange" min="0" max="500" step="50" value="200"><div class="budget-val" id="budgetVal">≤200元</div></div>
          </div>
          <div>
            <div style="font-size:11.5px;color:var(--sub);margin-bottom:5px">👥 同行人数</div>
            <div class="chips" id="crowdChips"></div>
          </div>
        </div>
      </div>
      <div class="sec-head" style="margin-top:14px">
        <h2 id="recTitle">为你推荐</h2><span class="more" onclick="toast('已按 匹配度 = 兴趣35% + 天气25% + 预算20% + 同行20% 排序')">排序逻辑 ▾</span>
      </div>
      <div id="recList"></div>
    </section>

    <!-- ============ Tab 2 组队 ============ -->
    <section class="page" id="page-team">
      <div class="sec-head"><h2>🤝 组队大厅</h2><span class="more" onclick="toast('队伍数据保存在本地，用于演示')">组队规则 ▾</span></div>
      <p style="font-size:12.5px;color:var(--sub);margin:-4px 2px 12px">一个人也可以出发，但结伴更有趣——发起新队伍，或加入感兴趣的周末小队。</p>
      <div id="teamList"></div>
    </section>

    <!-- ============ Tab 3 打卡 ============ -->
    <section class="page" id="page-checkin">
      <div class="sec-head"><h2>📍 我的周末足迹</h2></div>
      <div class="stats" id="statRow"></div>
      <div class="sec-head"><h2 style="font-size:14.5px">打卡时间线</h2><span class="more" onclick="toast('长按可删除（演示版暂未开放）')">记录：点击活动卡「打卡」生成</span></div>
      <div id="checkinList"></div>
    </section>

    <!-- ============ Tab 4 攻略 ============ -->
    <section class="page" id="page-guide">
      <div class="sec-head"><h2>📝 攻略广场</h2><span class="more" onclick="openPublish()">✍️ 写攻略</span></div>
      <div id="guideList"></div>
    </section>
  </main>

  <button class="fab" id="fab" onclick="onFab()" title="快捷发布">＋</button>

  <nav>
    <button data-tab="discover" class="on" onclick="switchTab('discover')"><span class="ico">🧭</span>逛逛</button>
    <button data-tab="team" onclick="switchTab('team')"><span class="ico">🤝</span>组队</button>
    <button data-tab="checkin" onclick="switchTab('checkin')"><span class="ico">📍</span>打卡</button>
    <button data-tab="guide" onclick="switchTab('guide')"><span class="ico">📝</span>攻略</button>
  </nav>
</div>

<!-- 活动详情 sheet -->
<div class="mask" id="maskDetail" onclick="if(event.target===this)closeSheet('maskDetail')">
  <div class="sheet" id="detailBody"></div>
</div>
<!-- 通用表单 sheet -->
<div class="mask" id="maskForm" onclick="if(event.target===this)closeSheet('maskForm')">
  <div class="sheet" id="formBody"></div>
</div>
<!-- 产品说明 sheet -->
<div class="mask" id="maskAbout" onclick="if(event.target===this)closeSheet('maskAbout')">
  <div class="sheet" id="aboutBody"></div>
</div>
<div id="toast"></div>

<script>
/* ================================================================
   周末出发 WeekendGO —— 周末城市探索指南（雏形 Demo）
   纯前端实现：数据为内置 Mock + localStorage 本地持久化
   ================================================================ */

/* ---------------- 基础数据 ---------------- */
const CITIES = ['北京','上海','广州','深圳','杭州'];
const CATS = {
  exhibit:{name:'展览',color:'#8B5CF6'}, market:{name:'市集',color:'#F59E0B'},
  show:{name:'演出',color:'#F43F5E'},   hike:{name:'徒步',color:'#10B981'},
  cafe:{name:'咖啡/轻食',color:'#D97706'}, night:{name:'夜生活',color:'#3B82F6'}
};
const INTERESTS = Object.keys(CATS);
const CROWDS = [
  {id:'solo',name:'独自',emoji:'🚶'},{id:'duo',name:'两人',emoji:'👯'},
  {id:'small',name:'3-5人',emoji:'👨‍👩‍👧'},{id:'big',name:'大部队',emoji:'🎉'}
];

/* 活动库：weatherFit sunny=晴天更佳 rainy=雨天友好 any=不受影响 */
const ACTS = [
  // 北京
  {id:1,city:'北京',cat:'exhibit',title:'「宇宙考古」沉浸式空间探索展',venue:'798艺术中心',area:'朝阳区·798',time:'周六周日 10:00-18:00',price:88,weatherFit:'rainy',crowd:['solo','duo','small'],desc:'联合国际空间机构打造的大型沉浸式展览，1200㎡ 星际场景，可预约讲解场，出片率极高。雨天/高温天的绝佳去处。'},
  {id:2,city:'北京',cat:'market',title:'伍德吃托克·秋季艺术市集',venue:'隆福文创园',area:'东城区·隆福寺',time:'周六至周日 11:00-21:00',price:35,weatherFit:'any',crowd:['duo','small','big'],desc:'100+ 独立创作者摊位，古着、黑胶、手作、精酿啤酒，傍晚有露天乐队演出。'},
  {id:3,city:'北京',cat:'hike',title:'香山红叶季·入门徒步线',venue:'香山公园—碧云寺环线',area:'海淀区·香山',time:'周六 08:30 集合',price:10,weatherFit:'sunny',crowd:['solo','small','big'],desc:'经典入门徒步环线，全程约 8km / 3.5h，山顶可俯瞰北京城。领队负责带路和拍照，适合新手。'},
  {id:4,city:'北京',cat:'show',title:'鼓浪音乐节·城市周末场',venue:'首钢园户外草坪',area:'石景山区·首钢园',time:'周六 14:00-22:00',price:180,weatherFit:'sunny',crowd:['duo','small','big'],desc:'独立乐队 + 电子舞台双舞台设置，日落场最出片，场内有创意餐车区。'},
  // 上海
  {id:5,city:'上海',cat:'exhibit',title:'teamLab 无界美术馆晨间场',venue:'teamLab无界 上海',area:'黄浦区·滨江',time:'周日 10:00-12:00 人少场',price:199,weatherFit:'rainy',crowd:['solo','duo'],desc:'晨间人少场，光影花海随意拍。提供和服租赁拍照服务，室内恒温，雨天无忧。'},

/* ---------------- 推荐打分 ----------------
   匹配度 = 兴趣匹配35% + 天气适配25% + 预算适配20% + 同行适配20% */
function scoreAct(a){
  const reasons=[];
  let interest = store.interests.includes(a.cat) ? 1 : 0.15;
  if(store.interests.includes(a.cat)) reasons.push({t:`✓ ${CATS[a.cat].name}是你感兴趣的`,c:'good'});
  let weather; const w=store.weather;
  if(a.weatherFit==='any'){weather=0.85;reasons.push({t:'☂️ 晴雨皆宜',c:'good'});}
  else if(a.weatherFit===w){weather=1;reasons.push({t:w==='rain'?'🌧️ 雨天友好':w==='sunny'?'☀️ 晴天优选':'☁️ 多云舒适',c:'good'});}
  else{weather=0.2;reasons.push({t:w==='rain'?'☔ 雨天体验打折':a.weatherFit==='rainy'?'同为室内备选':'⚠️ 户外受天气影响',c: a.weatherFit==='rainy'&&w==='sunny'?'':'warn'});}
  let budget = a.price<=store.budget?1:Math.max(0.15,1-(a.price-store.budget)/300);
  if(a.price<=store.budget) reasons.push({t:a.price===0?'🆓 免费活动':`💰 ¥${a.price} 在预算内`,c:'good'});
  else reasons.push({t:`💸 超预算 ¥${a.price-store.budget}`,c:'warn'});
  let crowd = a.crowd.includes(store.crowd)?1:0.3;
  if(a.crowd.includes(store.crowd)) reasons.push({t:`👥 适合${CROWDS.find(c=>c.id===store.crowd).name}出行`,c:'good'});
  const score = Math.round((interest*0.35+weather*0.25+budget*0.2+crowd*0.2)*100);
  return {score,reasons:reasons.sort((x,y)=>(x.c==='warn')-(y.c==='warn')).slice(0,3)};
}

const memColor = i => ['#FF7A00','#3B82F6','#8B5CF6','#10B981','#F43F5E','#F59E0B','#14B8A6','#6366F1'][i%8];
function toggleJoin(id){
  const i = store.joined.indexOf(id);

let _mood='😎';
function pick(el){document.querySelectorAll('#moodChips .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');_mood=el.dataset.m;}
function doCheckin(title,emoji,cat){
  const note=document.getElementById('ciNote').value.trim()||'打卡成功，下次写点感想～';
  const cost=+document.getElementById('ciCost').value||0;
  const now=new Date();
  const wd=['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  store.checkins.unshift({actTitle:title,emoji,mood:_mood,cat,note,time:`${wd} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,cost});
  save();closeSheet('maskForm');renderCheckins();
  switchTab('checkin');toast('📍 打卡成功！记录已同步到时间线');
}

  const i=store.liked.indexOf(id);
  if(i>=0){store.liked.splice(i,1);g.likes--;}else{store.liked.push(id);g.likes++;}
  save();renderGuides();
}
function openGuide(id){
  const g=store.guides.find(x=>x.id===id);
  openForm(`<div class="sheet-head"><h3>📝 攻略</h3><button class="close" onclick="closeSheet('maskForm')">✕</button></div>
    <h2 style="font-size:18px;margin-bottom:8px">${g.title}</h2>
    <div style="font-size:12px;color:var(--sub);margin-bottom:10px">✍️ ${g.author} · ${g.likes} 人觉得有用</div>
    <div class="g-tags" style="margin-bottom:12px">${g.tags.map(t=>`<span class="g-tag"># ${t}</span>`).join('')}</div>
    <div class="d-desc" style="white-space:pre-wrap">${g.body}</div>
    <button class="big-btn" onclick="closeSheet('maskForm');switchTab('discover')">找同款活动 →</button>`);
}
function openPublish(){
  openForm(`<div class="sheet-head"><h3>✍️ 分享你的周末攻略</h3><button class="close" onclick="closeSheet('maskForm')">✕</button></div>
    <div class="field"><label>标题</label><input type="text" id="gTitle" placeholder="例：杭州雨天一日室内路线"></div>
    <div class="field"><label>正文</label><textarea id="gBody" style="height:110px" placeholder="路线、花费、避雷、机位……"></textarea></div>
    <div class="field"><label>标签</label><input type="text" id="gTags" placeholder="用空格分隔，例：杭州 展览 雨天备选"></div>
    <button class="big-btn" onclick="doPublish()">发布攻略 🚀</button>`);
}
function doPublish(){
  const t=document.getElementById('gTitle').value.trim();
  const b=document.getElementById('gBody').value.trim();
  if(!t||!b)return toast('标题和正文都要填哦');
  const tags=document.getElementById('gTags').value.trim().split(/\s+/).filter(Boolean).slice(0,4);
  store.guides.unshift({id:'g'+Date.now(),title:t,author:'我（demo 用户）',tags:tags.length?tags:['通用'],excerpt:b.slice(0,60)+'…',likes:0,body:b});
  save();closeSheet('maskForm');renderGuides();switchTab('guide');toast('🚀 攻略已发布到广场');
}

/* ---------------- 活动详情 ---------------- */
function openDetail(id){
  const a=ACTS.find(x=>x.id===id);
  const s=scoreAct(a);
  const wf={sunny:'☀️ 晴天更佳',rainy:'☂️ 雨天友好',any:'🌤️ 晴雨皆宜'}[a.weatherFit];
  openForm(`<div class="sheet-head"><h3>活动详情</h3><button class="close" onclick="closeSheet('maskForm')">✕</button></div>
    <div class="detail-hero" style="background:${catBg(a.cat)}">${catEmoji(a.cat)}</div>
    <div style="text-align:center;margin-bottom:12px">
      <span class="cat-badge" style="background:${CATS[a.cat].color}">${CATS[a.cat].name}</span>
      <h2 style="font-size:18px;margin-top:6px">${a.title}</h2>
      <div style="font-size:12px;color:var(--sub);margin-top:4px">匹配度 ${s.score}% · ${wf}</div>
    </div>
    <div class="d-row"><span class="k">🕑 时间</span><span>${a.time}</span></div>
    <div class="d-row"><span class="k">📍 地点</span><span>${a.venue}（${a.area}）</span></div>
    <div class="d-row"><span class="k">💰 费用</span><span>${a.price===0?'免费':'约 ¥'+a.price+'/人'}${a.price>store.budget?' · <b style="color:var(--red)">超出你的预算</b>':''}</span></div>
    <div class="d-row"><span class="k">👥 适合</span><span>${a.crowd.map(c=>CROWDS.find(x=>x.id===c).name).join(' / ')}</span></div>
    <div class="d-desc">${a.desc}</div>
    <div class="reasons">${s.reasons.map(r=>`<span class="reason ${r.c}">${r.t}</span>`).join('')}</div>
    <div class="d-actions">
      <button class="btn-ghost" onclick="closeSheet('maskForm');openCheckin(${a.id})">📍 我去过了，打卡</button>
      <button class="btn-solid" onclick="closeSheet('maskForm');quickTeam(${a.id})">🤝 为它组队</button>
    </div>`);
}
function quickTeam(actId){
  const a=ACTS.find(x=>x.id===actId);
  openForm(`<div class="sheet-head"><h3>🤝 发起组队 · ${a.title.slice(0,12)}…</h3><button class="close" onclick="closeSheet('maskForm')">✕</button></div>
    <div class="field"><label>队伍名称</label><input type="text" id="tTitle" placeholder="例：周六看展搭子，缺3人"></div>
    <div class="field"><label>集合时间</label><input type="text" id="tTime" placeholder="例：周六 10:00"></div>
    <div class="field"><label>集合地点</label><input type="text" id="tMeet" placeholder="例：${a.venue}正门"></div>
    <div class="field"><label>成团人数（含你）</label><div class="chips" id="capChips">${[2,3,4,6,8].map((n,i)=>`<span class="chip ${i===1?'on':''}" data-n="${n}" onclick="pickNum(this)">${n}人</span>`).join('')}</div></div>
    <div class="field"><label>给队友的话</label><input type="text" id="tNote" placeholder="例：新手友好，AA制，看完约饭"></div>
    <button class="big-btn" onclick="doTeam(${actId})">发布队伍 🚀</button>`);
}
let _cap=3;
function pickNum(el){document.querySelectorAll('#capChips .chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');_cap=+el.dataset.n;}
function doTeam(actId){
  const a=ACTS.find(x=>x.id===actId);
  const title=document.getElementById('tTitle').value.trim()||`${a.title.slice(0,10)}搭子群`;
  const time=document.getElementById('tTime').value.trim()||'周六 10:00';
  const meet=document.getElementById('tMeet').value.trim()||`${a.venue}正门`;
  const note=document.getElementById('tNote').value.trim()||'来了就是队友';
  store.teams.unshift({id:'t'+Date.now(),actId,title,time,meet,cap:_cap,members:[ME],note});
  store.joined.push(store.teams[0].id);
  save();closeSheet('maskForm');renderTeams();switchTab('team');toast('🎉 队伍已发布，等队友加入！');
}

/* ---------------- 通用 UI ---------------- */
function openForm(html){document.getElementById('formBody').innerHTML=html;openSheet('maskForm');}
function openSheet(id){document.getElementById(id).classList.add('on');document.body.style.overflow='hidden';}
function closeSheet(id){document.getElementById(id).classList.remove('on');document.body.style.overflow='';}
let _toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove('on'),2200);}
function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.getElementById('page-'+tab).classList.add('on');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  document.getElementById('fab').style.display = (tab==='team'||tab==='guide')?'flex':'none';
  window.scrollTo(0,0);
}
function onFab(){
  const tab=document.querySelector('nav button.on').dataset.tab;
  if(tab==='team')openCreateTeamBlank();
  else openPublish();
}
function openCreateTeamBlank(){
  openForm(`<div class="sheet-head"><h3>🤝 自由发起组队</h3><button class="close" onclick="closeSheet('maskForm')">✕</button></div>
    <div class="field"><label>关联活动</label><select id="tAct">${ACTS.filter(a=>a.city===store.city).map(a=>`<option value="${a.id}">${a.title}</option>`).join('')}</select></div>
    <div class="field"><label>队伍名称</label><input type="text" id="tTitle" placeholder="例：周末爬山小队"></div>
    <div class="field"><label>集合时间</label><input type="text" id="tTime" placeholder="例：周日 09:00"></div>
    <div class="field"><label>集合地点</label><input type="text" id="tMeet" placeholder="例：地铁站A口"></div>
    <div class="field"><label>成团人数（含你）</label><div class="chips" id="capChips">${[2,3,4,6,8].map((n,i)=>`<span class="chip ${i===1?'on':''}" data-n="${n}" onclick="pickNum(this)">${n}人</span>`).join('')}</div></div>
    <div class="field"><label>给队友的话</label><input type="text" id="tNote" placeholder="例：AA制，新手友好"></div>
    <button class="big-btn" onclick="doTeam(+document.getElementById('tAct').value)">发布队伍 🚀</button>`);
}
function openCityPicker(){
  openForm(`<div class="sheet-head"><h3>📍 选择城市</h3><button class="close" onclick="closeSheet('maskForm')">✕</button></div>
    <div class="chips" style="gap:10px">${CITIES.map(c=>`<span class="chip ${c===store.city?'on':''}" style="padding:8px 20px;font-size:14px" onclick="setCity('${c}')">${c}</span>`).join('')}</div>
    <p style="font-size:12px;color:var(--sub);margin-top:12px">雏形版已内置 5 城市示例数据，正式版将接入美团同城活动供给。</p>`);
}
function setCity(c){store.city=c;save();closeSheet('maskForm');renderAll();toast('已切换到 '+c);}

/* ---------------- 偏好设置 ---------------- */
function renderPrefs(){
  document.getElementById('interestChips').innerHTML = INTERESTS.map(k=>`<span class="chip ${store.interests.includes(k)?'on':''}" onclick="toggleInterest('${k}',this)">${catEmoji(k)} ${CATS[k].name}</span>`).join('');
  document.getElementById('crowdChips').innerHTML = CROWDS.map(c=>`<span class="chip ${store.crowd===c.id?'on':''}" onclick="setCrowd('${c.id}')">${c.emoji} ${c.name}</span>`).join('');
  const r=document.getElementById('budgetRange');r.value=store.budget;
  document.getElementById('budgetVal').textContent = store.budget>=500?'不设上限':'≤'+store.budget+'元';
  document.getElementById('prefSummary').textContent = `已选${store.interests.length}类兴趣`;
}
function toggleInterest(k,el){
  const i=store.interests.indexOf(k);
  i>=0?store.interests.splice(i,1):store.interests.push(k);
  el.classList.toggle('on');save();renderDiscover();
}
function setCrowd(c){store.crowd=c;save();renderPrefs();renderDiscover();}
document.getElementById('budgetRange').addEventListener('input',e=>{
  store.budget=+e.target.value;
  document.getElementById('budgetVal').textContent = store.budget>=500?'不设上限':'≤'+store.budget+'元';
});
document.getElementById('budgetRange').addEventListener('change',()=>{save();renderDiscover();});
document.querySelectorAll('.w-sim button').forEach(b=>b.onclick=()=>{
  store.weather=b.dataset.w;save();renderWeather();renderDiscover();
  toast(WEATHER_MAP[store.weather].tip);
});

/* ---------------- 产品说明 ---------------- */

  document.getElementById('aboutBody').innerHTML=`<div class="sheet-head"><h3>🧭 产品说明（面试官入口）</h3><button class="close" onclick="closeSheet('maskAbout')">✕</button></div>
  <div class="pi-sec"><div class="pi-box"><b>一句话定位：</b>面向大学生的周末决策引擎 —— 把「去哪玩」从 30 分钟的刷帖纠结，变成 1 分钟的确定性出发。</div></div>

    <li><b>搭子难</b>：想去的活动找不到人一起；约好了又没人管集合</li>
    <li><b>无沉淀</b>：玩过就忘，经验和攻略没法积累复用</li></ul></div>
  <div class="pi-sec"><h4>🏗️ 产品功能架构</h4>
    <div class="tree">周末出发 WeekendGO
├─ 🧭 逛逛（决策层）
│   ├─ 偏好输入：城市 / 兴趣 / 预算 / 同行人数
│   ├─ 天气感知：模拟晴·多云·雨 → 推荐实时重排
│   └─ 匹配度排序 = 兴趣35% + 天气25% + 预算20% + 同行20%

│   ├─ 组队大厅：加入 / 退出 / 满员状态
│   └─ 从任意活动一键发起组队（集合时间·地点）
├─ 📍 打卡（留存层）
│   ├─ 心情 + 感想 + 花费 → 时间线沉淀
│   └─ 统计面板：打卡次数 / 总花费 / 解锁去处
└─ 📝 攻略（生态层）
    ├─ 广场浏览 / 点赞 / 详情
    └─ UGC 发布 → 反哺推荐内容供给</div></div>
  <div class="pi-sec"><h4>🔁 推荐逻辑（雏形版）</h4>
    <p>四维加权打分，透明可解释：每张卡片展示匹配度与推荐理由标签。天气是第一外生变量——雨天自动上浮「室内/雨天友好」活动并降权户外徒步；预算与同行人数做硬适配软排序。正式版将接入真实天气 API 与美团活动供给池。</p></div>
  <div class="pi-sec"><h4>🚧 后续迭代</h4>
    <ul><li>接入真实天气 API 与美团同城活动/门票供给</li><li>组队群聊与集合提醒（站内信）</li><li>打卡地图化：生成个人周末足迹热力图</li><li>攻略与活动挂载：看攻略直接买票/组队闭环</li></ul></div>
  <p style="font-size:11px;color:var(--sub);text-align:center;margin-top:6px">雏形版本：数据为本地 Mock，交互逻辑均已真实可玩</p>`;
  openSheet('maskAbout');

/* ---------------- 启动 ---------------- */
function renderAll(){renderWeather();renderPrefs();renderDiscover();renderTeams();renderCheckins();renderGuides();}
renderAll();
const _hash=location.hash.slice(1);
if(['team','checkin','guide'].includes(_hash))switchTab(_hash);
setTimeout(()=>toast('💡 先试试右上角「模拟天气」切换，看推荐实时变化！'),900);
</script>
